version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: sentinel_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: sentinel
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      # Aquí carga el archivo que pusiste en la carpeta database
      - ./database/sentinel.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_backend
    ports:
      - "8000:80"
    depends_on:
      - db
    volumes:
      - ./backend:/var/www/html
    restart: unless-stopped

  frontend:
    build:
      context: ./my-app
      dockerfile: Dockerfile
    container_name: sentinel_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./my-app:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data: